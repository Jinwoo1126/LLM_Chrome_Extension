<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LLM Chat</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="highlight.css">
</head>
<body class="popup-mode">
  <div class="container">
    <div class="header">
      <div class="header-content">
        <div class="logo">
          <img src="icons/icon32.png" alt="LLM Chat Icon" class="logo-icon">
          <span>LLM Chat</span>
        </div>
        <div class="header-actions">
          <!-- <div class="model-selector"> -->
            <!-- <select id="model-select"> -->
              <!-- Options will be populated dynamically -->
            <!-- </select> -->
          <!-- </div> -->
          <div class="menu-container">
            <button id="menu-button" class="menu-button" title="메뉴">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="1"></circle>
                <circle cx="12" cy="5" r="1"></circle>
                <circle cx="12" cy="19" r="1"></circle>
              </svg>
            </button>
            <div id="menu-dropdown" class="menu-dropdown hidden">
              <div class="menu-item" id="menu-settings">⚙️ 설정</div>
              <div class="menu-item" id="menu-clear-history">🗑️ 대화 기록 삭제</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="chat-container">
      <!-- Chat Tab Content -->
      <div id="chat-content" class="chat-content">
        <div id="chat-messages" class="chat-messages"></div>
        <div id="selection-info" class="selection-info hidden">
          <div class="selection-header">
            <div class="selection-header-left">
              <svg class="selection-header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
              <span>Selected Box</span>
            </div>
            <button id="close-selection" class="close-selection-button" title="선택 초기화">×</button>
          </div>
          <div class="selection-content">
            <div class="selection-text" id="selection-preview"></div>
            <div class="selection-buttons">
              <button id="summarize-selection" title="선택한 텍스트 요약">📝 Summarize</button>
              <button id="translate-selection" title="한국어로 번역">🌐 Translate</button>
            </div>
          </div>
        </div>
        <div class="input-container">
          <textarea id="user-input" placeholder="Type your message here..." rows="1"></textarea>
          <button id="send-button">Send</button>
        </div>
      </div>
      
      <!-- Settings Panel (hidden by default) -->
      <div id="settings-panel" class="settings-panel hidden">
        <div class="settings-header">
          <h3>설정</h3>
          <button id="close-settings" class="close-button">×</button>
        </div>
        <div class="settings-content">
          <div class="settings-group">
            <label for="api-type-select">API 종류</label>
            <select id="api-type-select">
              <option value="ollama">Ollama</option>
              <option value="vllm">vLLM</option>
            </select>
          </div>
          <div class="settings-group">
            <label for="lang-select">언어</label>
            <select id="lang-select">
              <option value="ko">한국어</option>
              <option value="en">English</option>
            </select>
          </div>
          <button id="save-settings" class="save-settings-button">저장</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="config.js"></script>
  <script src="marked.min.js"></script>
  <script src="highlight.min.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
